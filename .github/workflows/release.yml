name: Release

on:
  workflow_call:
    inputs:
      release_description:
        description: "Description"
        required: false
        type: string
        default: "JPortal2 - Release"
      release_type:
        description: "Next Maven Release Version (patch, minor, major)"
        required: false
        type: string
        default: "patch"
  workflow_dispatch:
    inputs:
      release_description:
        description: "Description"
        required: false
        default: "JPortal2 - Release"
      release_type:
        description: "Next Maven Release Version (patch, minor, major)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write
  actions: write

concurrency:
  group: release-master
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: si-gen/jportal2

jobs:
  maven_release:
    name: "Maven Release"
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}
      # native-maven-plugin 1.1.14 is Java 17 bytecode. The old release image
      # only provided Java 11, which cannot load NativeExtension.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: ossrh
          server-username: OSSRH_USERNAME
          server-password: OSSRH_TOKEN
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
      # setup-java writes this value straight to gpg. The secret is base64,
      # which is the form the previous release action decoded before import.
      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "${HOME}/.gnupg"
          printf 'allow-loopback-pinentry\n' >> "${HOME}/.gnupg/gpg-agent.conf"
          printf 'pinentry-mode loopback\n' >> "${HOME}/.gnupg/gpg.conf"
          gpgconf --kill gpg-agent || true
          keyfile="$(mktemp)"
          trap 'rm -f "$keyfile"' EXIT
          if printf '%s' "${GPG_PRIVATE_KEY}" | grep -q 'BEGIN PGP PRIVATE KEY BLOCK'; then
            printf '%s\n' "${GPG_PRIVATE_KEY}" > "$keyfile"
          else
            printf '%s' "${GPG_PRIVATE_KEY}" | tr -d '[:space:]' | base64 -d > "$keyfile"
          fi
          gpg --batch --import "$keyfile"
          gpg --batch --list-secret-keys --keyid-format LONG
      - name: "Maven Release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail
          git config user.name "bbd-github-bot"
          git config user.email "bbdgithubbot@gmail.com"
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"

          version="$(mvn -B -q org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -Dexpression=project.version -DforceStdout)"
          base="${version%-SNAPSHOT}"
          IFS=. read -r major minor patch <<< "${base}"
          dev_version_arg=()
          case "${RELEASE_TYPE}" in
            minor)
              dev_version_arg=(-DdevelopmentVersion="${major}.$((minor + 1)).0-SNAPSHOT")
              ;;
            major)
              dev_version_arg=(-DdevelopmentVersion="$((major + 1)).0.0-SNAPSHOT")
              ;;
          esac

          inner_args="-DskipTests -DskipITs -Ddockerfile.skip -DdockerCompose.skip -Dgpg.keyname=${GPG_KEY_ID} -Dgpg.passphrase=${GPG_PASSPHRASE} -Prelease-oss-maven-central,gpg"
          release_args=(
            -Dusername=x-access-token
            -Dpassword="${GITHUB_TOKEN}"
            -Dgpg.keyname="${GPG_KEY_ID}"
            -Dgpg.passphrase="${GPG_PASSPHRASE}"
            -Darguments="${inner_args}"
          )
          if ! mvn -B org.apache.maven.plugins:maven-release-plugin:3.1.1:prepare \
            "${release_args[@]}" \
            "${dev_version_arg[@]}"
          then
            mvn -B org.apache.maven.plugins:maven-release-plugin:3.1.1:rollback || true
            exit 1
          fi
          if ! mvn -B org.apache.maven.plugins:maven-release-plugin:3.1.1:perform \
            "${release_args[@]}"
          then
            mvn -B org.apache.maven.plugins:maven-release-plugin:3.1.1:rollback || true
            exit 1
          fi

  build_and_publish:
    name: "Build and Publish"
    runs-on: ubuntu-latest
    needs: maven_release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: "Get Previous tag"
        id: previoustag
        uses: "WyriHaximus/github-action-get-previous-tag@v1"
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      - name: Build Changelog
        id: github_release
        uses: mikepenz/release-changelog-builder-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "Change Maven Version"
        run: |
          mvn versions:set -DnewVersion=${{ steps.previoustag.outputs.tag }}
      # Generate Jar File
      - name: "Generate Jar"
        run: mvn package -Dmaven.javadoc.skip=true -DskipTests -DskipITs  -Dgpg.passphrase=${{ secrets.GPG_PASSPHRASE }}
      - name: "Upload Jar Files to Release"
        uses: svenstaro/upload-release-action@v2
        id: upload_jar
        with:
          release_name: ${{ steps.previoustag.outputs.tag }}
          body: "${{ inputs.release_description }}<br/><br/><b>Change Log</b><br/>${{ steps.github_release.outputs.changelog }}"
          tag: ${{ steps.previoustag.outputs.tag }}
          overwrite: true
          asset_name: jportal2-${{ steps.previoustag.outputs.tag }}.jar
          file: target/jportal2-${{ steps.previoustag.outputs.tag }}.jar
          repo_token: ${{ secrets.GITHUB_TOKEN }}
      - name: DOWNLOAD URL
        run: echo "**** DOWNLOAD URL ****\n${{steps.upload_jar.browser_download_urls}}"
      # Build and push Docker Image
      - name: Log in to the docker container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./docker/alpine/Dockerfile
          build-args: |
            JPORTAL2_VERSION=${{ steps.previoustag.outputs.tag }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.previoustag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
      - name: Queue native release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run native.yml --ref "${{ steps.previoustag.outputs.tag }}"
