[package]
name = "jportal2-rust"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "jportal2"
path = "src/main.rs"

[lib]
name = "jportal2_lib"
path = "src/lib.rs"

[dependencies]
pest = "2.7"
pest_derive = "2.7"
log = "0.4"
env_logger = "0.10"
tera = "1.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.8"
